# Create release files
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  DOCKER_IMAGE: radarbase/radar-output-restructure

jobs:
  upload:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCHEMAS_GITHUB_USER: ${{ vars.SCHEMAS_GITHUB_USER }}
      SCHEMAS_GITHUB_TOKEN: ${{ secrets.SCHEMAS_GITHUB_TOKEN }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11

      - uses: gradle/gradle-build-action@v2

      - name: Decrypt libraries
        run: ./.github/scripts/decrypt_libraries.sh
        env:
          E4LINK_PASSPHRASE: ${{ secrets.E4LINK_PASSPHRASE }}

      # Compile code
      - name: Compile code
        run: ./gradlew assembleRelease

      # Upload it to GitHub
      - name: Upload to GitHub
        uses: AButler/upload-release-assets@v2.0
        with:
          files: '*/build/outputs/aar/*;plugins/*/build/outputs/aar/*'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        run: ./gradlew publish
